# 鴿子道具一覽。網站會自動按 name 的字母順序排列。
#
# 要新增一個道具，照下面的格式加四到五行就好：
#
# - name: 道具的英文名稱
#   maker: 廠商
#   desc: 一百字以內的效果說明，只寫效果，不寫手法
#   link: 示範影片或商品頁的網址
#
# desc 可以用中文，不用加引號；如果內容裡有冒號，才需要用雙引號框起來。

- name: Automatic Hat to Bird Cage
  maker: Tora Magic
  desc: 手上展示一頂帽子，接著在瞬間變成一個鳥籠。這個道具的效果很單純，快到幾乎沒有過程可言。
  link: https://www.youtube.com/watch?v=T6SQzeQdiyw

- name: Break Open Production Box
  maker: JL Magic
  desc: 正面挖空的箱子，觀眾看得到裡面是空的。放進一條白絲巾，蓋子一掀，箱子四面同時倒下攤平，絲巾變成兩隻活的白鴿。箱子攤開後只剩骨架，沒有藏東西的空間。
  link: https://www.youtube.com/watch?v=xMg5fV8tEdY

- name: Newspaper Break Away Dove Vanish
  maker: Daytona Magic
  desc: 六個面都糊著報紙的小箱子，鴿子放進去之後，表演者依序打穿每一面的報紙，把六個面全部拆開。箱子拆光了，鴿子也不見了。
  link: https://www.youtube.com/watch?v=ZfIygG8BkPE
