# ── 網站基本資料 ──────────────────────────────────────────────
title: 李醫師的鳩是魔法
tagline: 白斑鳩的日常飼育、育雛、訓練與鴿子魔術紀錄
# 這段會出現在 Google 搜尋結果的摘要，以及分享連結時的說明文字
description: >-
  鴿子魔術秀表演者李醫師的白斑鳩紀錄：日常飼育、配對育雛、上手訓練與健康照護，
  以及魔術手法與表演現場。台灣魔術發展協會舞台魔術冠軍、亞洲魔術大會「亞洲之夜」表演嘉賓。
author: 李醫師
lang: zh-Hant

# 部署後改成你的網址，例如 https://drleedovemagic.com
url: "https://sherlocklee0212.github.io"
baseurl: "/drleedovemagic"

# ── 文章網址格式 ──────────────────────────────────────────────
permalink: /posts/:year/:month/:day/:title/
timezone: Asia/Taipei

# ── 建置設定 ─────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
