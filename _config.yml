# ── 網站基本資料 ──────────────────────────────────────────────
title: 李醫師的鳩是魔法
tagline: 白斑鳩的日常飼育、育雛、訓練與鴿子魔術紀錄
description: >-
  李醫師的鳩是魔法（DrLeeDoveMagic）— 記錄我與白斑鳩之間的日常：
  飼養、育雛、訓練與健康照護，以及鴿子魔術的手法思考與表演紀錄。
author: 李醫師
lang: zh-Hant

# 部署後改成你的網址，例如 https://drleedovemagic.com
url: ""
baseurl: ""

# ── 文章網址格式 ──────────────────────────────────────────────
permalink: /posts/:year/:month/:day/:title/
timezone: Asia/Taipei

# ── 建置設定 ─────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
